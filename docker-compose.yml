# =============================================================================
# USARE Docker Compose — Isolated Network Deployment
# =============================================================================
# Runs USARE in a custom bridge network to mask host MAC and kernel.
# The encrypted output is volume-mapped for retrieval.
#
# Usage:
#   docker compose run --rm usare --target 192.168.1.1 --ports 22,80,443 --ghost
#   docker compose run --rm usare --decrypt /app/output/results.enc --password <pass>
# =============================================================================

version: "3.9"

services:
  usare:
    build:
      context: .
      dockerfile: Dockerfile
    image: usare:latest
    container_name: usare-scanner

    # Required capabilities for raw socket and MAC spoofing
    cap_add:
      - NET_RAW       # Raw socket access (Scapy)
      - NET_ADMIN     # MAC address randomization

    # Drop all other capabilities for security
    cap_drop:
      - ALL

    # Security options
    security_opt:
      - no-new-privileges:true

    # Custom isolated bridge network
    networks:
      - usare_net

    # Map output directory for encrypted results
    volumes:
      - ./output:/app/output

    # Read-only filesystem (except output volume)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

    # No restart (one-shot tool)
    restart: "no"

    # DNS configuration (prevent DNS leaks)
    dns:
      - 1.1.1.1
      - 9.9.9.9

    # Environment
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

networks:
  usare_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: usare_br0
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
